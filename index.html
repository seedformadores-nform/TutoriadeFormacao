        const normalizePhotoUrl = (url) => {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        };

        const SafeImage = ({ src, alt, className = '', fallbackName = '?' }) => {
            const [imgSrc, setImgSrc] = useState(normalizePhotoUrl(src));
            const [hasError, setHasError] = useState(false);

            const handleError = () => {
                const match = src?.match(/\/d\/([a-zA-Z0-9_-]+)/) || src?.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1] && !imgSrc.includes('drive.google.com/uc')) {
                    setImgSrc(`https://drive.google.com/uc?export=view&id=${match[1]}`);
                } else {
                    setHasError(true);
                }
            };

            if (hasError || !src) {
                const initial = fallbackName.trim().charAt(0).toUpperCase();
                return (
                    <div className={`w-full h-full flex items-center justify-center bg-gradient-to-tr from-slate-200 to-slate-100 text-slate-600 font-black select-none ${className}`}>
                        <span className="text-lg md:text-xl">{initial}</span>
                    </div>
                );
            }

            return (
                <img 
                    src={imgSrc} 
                    alt={alt} 
                    className={className} 
                    onError={handleError} 
                />
            );
        };

                return matchesNre || matchesTutor;

                    className={`flex items-center gap-3 p-3 rounded-2xl bg-white border border-slate-100 shadow-xs transition-all cursor-pointer group ${matches ? 'ring-4 ring-pink-500 scale-[1.02] shadow-pink-100' : 'hover:border-slate-300 hover:shadow-md active:scale-95'}`}
                >
                    <div className="w-12 h-12 rounded-full border-2 border-emerald-500 overflow-hidden flex-shrink-0 group-hover:scale-105 transition-transform">
                        <SafeImage 
                            src={tutor.photoUrl} 
                            alt={tutor.name} 
                            className="w-full h-full object-cover" 
                            fallbackName={tutor.name}
                        />
                    </div>
                    <div className="overflow-hidden">
                        <h4 className="font-extrabold text-slate-800 text-[11px] uppercase leading-tight truncate">{tutor.name}</h4>
                        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-tight mt-0.5">{tutor.role}</p>
                    </div>
                </div>
            );
        };

        // Coluna do NRE (sem o botão de recolher: lista de tutores fica sempre aberta)
        const NreColumn = ({ nre, searchTerm, onSelect }) => {
            const totalTutores = nre.tutores.length;

            return (
                <div className="flex flex-col gap-4 w-full">
                    {/* Card Principal do NRE */}
                    <div 
                        style={{ borderTop: `6px solid ${COLORS.seedGreen}` }}
                        className="bg-white p-6 rounded-3xl shadow-lg border border-slate-100 flex flex-col items-center text-center cursor-pointer hover:shadow-xl transition-shadow group"
                        onClick={() => onSelect(nre, 'nre')}
                    >
                        <h3 className="text-lg font-black text-slate-900 uppercase tracking-tight leading-tight group-hover:text-emerald-700 transition-colors">
                            {nre.name}
                        </h3>
                        <span className="mt-2 px-3 py-0.5 rounded-full text-[10px] font-black text-emerald-800 bg-emerald-50 uppercase tracking-wider">
                            {totalTutores} {totalTutores === 1 ? 'Tutor' : 'Tutores'}
                        </span>
                    </div>

                    {/* Lista de Tutores (sempre aberta) */}
                    <div className="grid grid-cols-1 gap-2.5">
                        {nre.tutores.map(tutor => (
                            <TutorCard 
                                key={tutor.id} 
                                tutor={tutor} 
                                nre={nre} 
                                searchTerm={searchTerm} 
                                onClick={onSelect} 
                            />
                        ))}
                    </div>
                </div>
            );
        };

        function App() {
            const [searchTerm, setSearchTerm] = useState('');
            const [zoom, setZoom] = useState(1);
            const [selectedItem, setSelectedItem] = useState(null);
            const [selectedType, setSelectedType] = useState(null);
            const [isCarinhoOpen, setIsCarinhoOpen] = useState(false);
            const [reactions, setReactions] = useState(initialReactions);
            const [toastMessage, setToastMessage] = useState(null);

            const totalTutores = useMemo(() => {
                return nresData.reduce((acc, curr) => acc + curr.tutores.length, 0);
            }, []);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 4000);
            };

            const handleSendCarinho = (tutor, nre, gestureType) => {
                setReactions(prev => {
                    const current = prev[tutor.id] || { smile: 0, partner: 0, heart: 0 };
                    return {
                        ...prev,
                        [tutor.id]: {
                            ...current,
                            [gestureType]: current[gestureType] + 1
                        }
                    };
                });

                const emojis = { smile: '😊 Sorriso', partner: '🤝 Parceria', heart: '❤️ Coração' };
                showToast(`Gesto de ${emojis[gestureType]} enviado com carinho para ${tutor.name}!`);
            };

            const handlePrint = () => {
                window.focus();
                const originalZoom = zoom;
                setZoom(1);
                setTimeout(() => {
                    try { window.print(); } catch (err) {}
                    setZoom(originalZoom);
                }, 400);
            };

            return (
                <div className="min-h-screen p-4 md:p-10 print:bg-white print:p-2 flex flex-col justify-between">
                    {/* Toast de Confirmação */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-[150] bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 text-xs font-extrabold animate-bounce no-print border border-slate-700">
                            <span>✨</span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Modais */}
                    <DetailsModal 
                        item={selectedItem} 
                        type={selectedType} 
                        onClose={() => setSelectedItem(null)} 
                        reactions={reactions}
                    />

                    <MandeCarinhoModal 
                        isOpen={isCarinhoOpen} 
                        onClose={() => setIsCarinhoOpen(false)} 
                        nres={nresData} 
                        onSendCarinho={handleSendCarinho}
                        reactions={reactions}
                    />

                    {/* Barra Superior / Header */}
                    <div className="max-w-[1700px] mx-auto w-full mb-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6 border-b border-slate-200 pb-8 no-print">
                        <div className="flex items-center gap-5">
                            {/* Logo oficial do Programa Formadores em Ação */}
                            <img 
                                src="https://lh3.googleusercontent.com/d/1dxKM7C_oDPbtE6YNYFTGCZ_55n1IlZg-" 
                                alt="Formadores em Ação" 
                                className="h-16 md:h-20 w-auto object-contain"
                                onError={(e) => { e.target.src = 'https://drive.google.com/uc?export=view&id=1dxKM7C_oDPbtE6YNYFTGCZ_55n1IlZg-'; }}
                            />
                            <div>
                                <span className="text-[11px] font-black tracking-widest text-emerald-700 uppercase block">
                                    Secretaria de Estado da Educação do Paraná
                                </span>
                                <h1 className="text-xl md:text-2xl font-black text-slate-900 uppercase tracking-tight">
                                    Tutoria de Formação nos 32 NREs
                                </h1>
                            </div>
                        </div>

                        {/* Barra de Pesquisa, Zoom e Ação */}
                        <div className="flex flex-wrap items-center gap-4">
                            {/* Botão de Atalho "Mande um Carinho" */}
                            <button 
                                onClick={() => setIsCarinhoOpen(true)}
                                className="px-5 py-3.5 rounded-3xl bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-black text-xs uppercase tracking-wider shadow-lg shadow-rose-200 transition-all flex items-center gap-2 active:scale-95"
                            >
                                <span>❤️</span>
                                <span>Mande um carinho!</span>
                            </button>

                            {/* Campo de Busca */}
                            <div className="relative">
                                <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                                    <IconSearch />
                                </div>
                                <input 
                                    type="text" 
                                    placeholder="Pesquisar tutor ou NRE..." 
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="pl-12 pr-6 py-3.5 bg-white border-2 border-slate-200 rounded-3xl w-72 md:w-80 focus:border-emerald-500 outline-none shadow-sm text-slate-700 text-sm font-semibold transition-all"
                                />
                            </div>

                            {/* Controles de Zoom e Impressão */}
                            <div className="flex items-center gap-2">
                                <div className="flex bg-white rounded-3xl border-2 border-slate-200 p-1.5 shadow-sm">
                                    <button onClick={() => setZoom(Math.max(zoom - 0.1, 0.4))} className="p-2.5 hover:bg-slate-50 rounded-2xl text-slate-600" title="Diminuir Zoom"><IconZoomOut /></button>
                                    <button onClick={() => setZoom(1)} className="px-3 font-black text-xs text-slate-400 uppercase" title="Tamanho Padrão">100%</button>
                                    <button onClick={() => setZoom(Math.min(zoom + 0.1, 1.4))} className="p-2.5 hover:bg-slate-50 rounded-2xl text-slate-600" title="Aumentar Zoom"><IconZoomIn /></button>
                                </div>
                                <button onClick={handlePrint} className="p-3.5 bg-slate-900 text-white rounded-3xl shadow-md hover:bg-slate-800 active:scale-95" title="Imprimir Organograma">
                                    <IconPrinter />
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Área do Organograma com Zoom */}
                    <div style={{ transform: `scale(${zoom})`, transformOrigin: 'top center' }} className="max-w-[1700px] mx-auto w-full transition-transform duration-200 print-full">
                        
                        {/* Topo Hierárquico do Organograma */}
                        <div className="flex flex-col items-center mb-16 relative">
                            {/* Card Central */}
                            <div 
                                style={{ borderTop: `8px solid ${COLORS.seedGreen}` }}
                                className="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-200 text-center w-full max-w-md relative z-10 print:shadow-none"
                            >
                                <h2 className="text-2xl font-black text-slate-900 uppercase tracking-tight">
                                    Programa Formadores em Ação
                                </h2>
                                <p className="text-xs font-bold text-slate-500 mt-1 uppercase tracking-wider">
                                    Rede dos 32 Núcleos Regionais de Educação
                                </p>

                                {/* Indicadores */}
                                <div className="mt-6 grid grid-cols-2 gap-3 pt-6 border-t border-slate-100">
                                    <div className="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                                        <span className="text-2xl font-black text-slate-800">32</span>
                                        <p className="text-[10px] font-black uppercase text-slate-400 tracking-wider">Núcleos (NREs)</p>
                                    </div>
                                    <div className="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                                        <span className="text-2xl font-black text-emerald-600">{totalTutores}</span>
                                        <p className="text-[10px] font-black uppercase text-slate-400 tracking-wider">Tutores Ativos</p>
                                    </div>
                                </div>
                            </div>

                            {/* Linha vertical conectando à rede dos 32 NREs */}
                            <div className="h-12 w-1 bg-slate-300 no-print"></div>
                        </div>

                        {/* Grade com os 32 NREs e seus Tutores */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 items-start">
                            {nresData.map(nre => (
                                <NreColumn 
                                    key={nre.id} 
                                    nre={nre} 
                                    searchTerm={searchTerm} 
                                    onSelect={(item, type) => {
                                        setSelectedItem(item);
                                        setSelectedType(type);
                                    }} 
                                />
                            ))}
                        </div>
                    </div>

                    {/* Rodapé Institucional */}
                    <footer className="mt-20 pt-8 border-t border-slate-200 text-center text-xs text-slate-500 font-semibold no-print">
                        <p>
                            Núcleo Formadores em Ação - Secretaria de Estado de Educação do Paraná | Av. Presidente Kennedy, 2511 - Guaíra - Curitiba | PR | Contato: seed_formadores@escola.pr.gov.br
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
